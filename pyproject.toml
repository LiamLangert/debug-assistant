[project]
name = "debug-assistant"
version = "0.1.0"
description = "CS6170 Capstone Project - Locates and provides hints for Python bugs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets<2.21",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
]
